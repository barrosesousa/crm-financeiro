<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barros &amp; Sousa</title>
<style>
  :root{
    --bg:#F8F6F2;
    --surface:#FFFFFF;
    --border:#E8E1D8;
    --border-strong:#D9CFC2;
    --ink:#2B2019;
    --ink-soft:#6B5A4C;
    --ink-faint:#9A8776;
    --brand:#7F563A;
    --brand-soft:#F1E6DB;
    --brand-dark:#5E3F2A;
    --green:#1B9E6B;
    --green-soft:#E3F3EA;
    --amber:#B86F10;
    --amber-soft:#F8EAD3;
    --red:#C73E55;
    --red-soft:#F8E6E9;
    --radius:14px;
    --radius-sm:10px;
    --shadow: 0 1px 2px rgba(60,40,20,.06), 0 1px 1px rgba(60,40,20,.03);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{min-height:100vh;}
  #app{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}
  img,svg{max-width:100%;}

  /* Header */
  .header{margin-bottom:22px;}
  .header .eyebrow{font-size:11px;letter-spacing:.09em;color:var(--ink-faint);font-weight:600;margin-bottom:6px;}
  .logo{display:flex;align-items:baseline;gap:0;font-weight:800;font-size:30px;letter-spacing:-.01em;color:var(--ink);}

  /* Tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-strong);margin-top:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    padding:11px 4px;margin-right:22px;font-size:14px;font-weight:600;color:var(--ink-faint);
    cursor:pointer;border-bottom:2px solid transparent;user-select:none;transition:color .15s;
    white-space:nowrap;flex-shrink:0;
  }
  .tab:hover{color:var(--ink-soft);}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand);}

  /* Toolbar */
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 18px;}
  .toolbar .btn{white-space:nowrap;}
  .month-nav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 8px;box-shadow:var(--shadow);}
  .month-nav button{border:none;background:transparent;width:26px;height:26px;border-radius:50%;color:var(--ink-soft);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
  .month-nav button:hover{background:var(--brand-soft);}
  .month-nav .label{font-weight:700;font-size:14px;min-width:120px;text-align:center;}
  .search-input{flex:1;min-width:180px;max-width:280px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14px;box-shadow:var(--shadow);color:var(--ink);}
  .search-input:focus{outline:none;border-color:var(--brand);}
  .select-input{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14px;box-shadow:var(--shadow);color:var(--ink);}
  .spacer{flex:1;}
  .view-toggle{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;box-shadow:var(--shadow);gap:2px;}
  .view-toggle button{border:none;background:transparent;width:30px;height:28px;border-radius:7px;cursor:pointer;color:var(--ink-faint);display:flex;align-items:center;justify-content:center;}
  .view-toggle button.active{background:var(--brand-soft);color:var(--brand-dark);}
  .view-toggle button:hover:not(.active){background:var(--bg);}
  .view-toggle svg{width:15px;height:15px;}
  .btn{
    border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;
    transition:filter .15s, background .15s; letter-spacing:.01em;
  }
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:hover{filter:brightness(1.1);}
  .btn-ghost{background:var(--surface);color:var(--ink-soft);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--brand-soft);}

  /* Stat cards */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .stat{padding:20px 22px;border-right:1px solid var(--border);}
  .stat:last-child{border-right:none;}
  .stat .label{font-size:11px;letter-spacing:.08em;color:var(--ink-faint);font-weight:700;margin-bottom:8px;}
  .stat .value{font-size:27px;font-weight:800;letter-spacing:-.01em;}
  .stat .sub{font-size:12.5px;color:var(--ink-faint);margin-top:5px;}
  .stat .value.blue{color:var(--brand);}
  .stat .value.green{color:var(--green);}
  .stat .value.amber{color:var(--amber);}
  .stat .value.red{color:var(--red);}

  /* Result panel */
  .result-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:16px;padding:26px 26px 22px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:18px;}
  .result-left .label{font-size:11px;letter-spacing:.08em;color:var(--ink-faint);font-weight:700;margin-bottom:8px;}
  .result-left .value{font-size:38px;font-weight:800;letter-spacing:-.02em;}
  .result-left .sub{font-size:13px;color:var(--ink-faint);margin-top:6px;}
  .result-right{min-width:260px;flex:1;max-width:420px;display:flex;flex-direction:column;justify-content:flex-end;}
  .result-right .tag{font-size:12.5px;color:var(--ink-faint);text-align:right;margin-bottom:10px;}
  .progress-track{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--brand);border-radius:99px;transition:width .3s;}
  .progress-caption{font-size:12.5px;color:var(--ink-faint);margin-top:10px;text-align:right;}

  .section-title{font-size:11px;letter-spacing:.08em;font-weight:700;color:var(--ink-faint);margin:26px 0 12px;}

  /* Empty */
  .empty{border:1.5px dashed var(--border-strong);border-radius:var(--radius);padding:56px 24px;text-align:center;color:var(--ink-faint);background:var(--surface);}
  .empty .title{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .empty .desc{font-size:13.5px;}

  /* Cards */
  .entries-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .entry-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:16px 18px;}
  .entry-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .entry-card .client{font-weight:700;font-size:15px;}
  .entry-card .value{font-weight:800;font-size:18px;margin-top:6px;color:var(--brand-dark);}
  .entry-card .meta{font-size:12.5px;color:var(--ink-faint);margin-top:4px;}
  .entry-card .desc{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.4;}
  .entry-card .actions{display:flex;gap:8px;margin-top:14px;align-items:center;}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap;}
  .pill.green{background:var(--green-soft);color:var(--green);}
  .pill.amber{background:var(--amber-soft);color:var(--amber);}
  .adv-pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand-dark);}
  .icon-btn{border:none;background:var(--brand-soft);width:28px;height:28px;border-radius:8px;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .icon-btn:hover{background:var(--border);}
  .mark-btn{font-size:11.5px;font-weight:700;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--ink-soft);}
  .mark-btn.done{background:var(--green-soft);color:var(--green);border-color:transparent;}

  /* Tables */
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;min-width:640px;}
  thead th{text-align:left;font-size:11px;letter-spacing:.07em;font-weight:700;color:var(--ink-faint);background:var(--brand-soft);padding:13px 18px;border-bottom:1px solid var(--border);}
  tbody td{padding:15px 18px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAF8F5;}
  .cat-pill{background:var(--brand-soft);color:var(--brand-dark);font-weight:700;font-size:11.5px;padding:4px 10px;border-radius:99px;display:inline-block;}
  .type-pill{font-weight:700;font-size:11.5px;padding:4px 10px;border-radius:99px;display:inline-block;}
  .type-pill.recorrente{background:var(--brand-soft);color:var(--brand-dark);}
  .type-pill.pontual{background:var(--amber-soft);color:var(--amber);}
  .valor-cell{font-weight:800;}
  .status-toggle{display:flex;align-items:center;gap:9px;}
  .switch{position:relative;width:36px;height:20px;border-radius:99px;background:var(--border-strong);cursor:pointer;transition:background .15s;flex-shrink:0;}
  .switch.on{background:var(--green);}
  .switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .switch.on .knob{left:18px;}
  .status-text{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .status-text.paid{color:var(--green);}
  .row-actions{display:flex;gap:8px;}

  /* Relatórios */
  .rel-block{margin-top:26px;}
  .rel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .rel-title{font-size:16px;font-weight:800;color:var(--brand-dark);display:flex;align-items:center;gap:9px;}
  .rel-title .dot{width:10px;height:10px;border-radius:50%;background:var(--brand);}
  .rel-count{font-size:12.5px;color:var(--ink-faint);}
  .rel-table{min-width:820px;}
  .rel-table th.num,.rel-table td.num{text-align:right;white-space:nowrap;}
  .rel-table td.nome{font-weight:600;}
  .rel-table tfoot td{padding:14px 18px;font-size:13.5px;font-weight:800;background:var(--brand-soft);border-top:2px solid var(--brand);color:var(--brand-dark);}
  .rel-table tbody td.vazio{text-align:center;color:var(--ink-faint);padding:26px 18px;}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(40,28,18,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:100;}
  .modal{background:var(--surface);border-radius:18px;max-width:560px;width:100%;padding:30px 32px 26px;box-shadow:0 20px 60px rgba(40,28,18,.3);}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .modal-eyebrow{font-size:11px;letter-spacing:.08em;color:var(--ink-faint);font-weight:700;margin-bottom:4px;}
  .modal-title{font-size:21px;font-weight:800;letter-spacing:-.01em;}
  .modal-close{border:none;background:transparent;font-size:18px;cursor:pointer;color:var(--ink-faint);width:30px;height:30px;border-radius:8px;}
  .modal-close:hover{background:var(--brand-soft);}
  hr.div{border:none;border-top:1px solid var(--border);margin:0 0 20px;}
  .field{margin-bottom:16px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  label.flabel{display:block;font-size:11px;letter-spacing:.07em;font-weight:700;color:var(--ink-faint);margin-bottom:7px;}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;border:1px solid var(--border);background:#F8F6F2;border-radius:10px;padding:11px 13px;font-size:14px;color:var(--ink);font-family:inherit;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);background:#fff;}
  textarea{resize:vertical;min-height:72px;}
  .radio-group{display:flex;gap:20px;align-items:center;flex-wrap:wrap;row-gap:10px;}
  .radio-opt{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;}
  .radio-opt input{width:16px;height:16px;accent-color:var(--brand);}
  .helper-text{font-size:12.5px;color:var(--ink-faint);margin-top:6px;}
  .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border);}
  .cat-row{display:flex;gap:8px;}
  .cat-row select{flex:1;}
  .add-cat-btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:0 14px;font-size:13px;font-weight:700;color:var(--brand);cursor:pointer;white-space:nowrap;}
  .add-cat-btn:hover{background:var(--brand-soft);}
  .subpanel{background:#F8F6F2;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
  .subpanel .flabel{margin-bottom:10px;}

  ::placeholder{color:var(--ink-faint);}

  /* ---------- Responsive ---------- */
  @media (max-width:900px){
    #app{padding:22px 16px 70px;}
    .stats{grid-template-columns:repeat(2,1fr);}
    .stat{border-right:none;border-bottom:1px solid var(--border);}
    .stat:last-child{border-bottom:none;}
    .result-panel{flex-direction:column;}
    .result-right{max-width:100%;}
  }

  @media (max-width:700px){
    /* Relatórios: cada linha vira um cartão com todas as informações */
    .rel-table{min-width:0;}
    .rel-table thead{display:none;}
    .rel-table,.rel-table tbody,.rel-table tfoot,.rel-table tr,.rel-table td{display:block;width:100%;}
    .rel-table tbody tr{padding:12px 16px;border-bottom:1px solid var(--border);}
    .rel-table tbody tr:last-child{border-bottom:none;}
    .rel-table td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 0 !important;border:none !important;text-align:right !important;font-size:13.5px;}
    .rel-table td::before{content:attr(data-label);font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ink-faint);text-transform:uppercase;text-align:left;}
    .rel-table td.nome{font-size:15px;font-weight:800;padding-bottom:8px !important;}
    .rel-table td.nome::before{content:"";}
    .rel-table td.vazio{display:block;text-align:center !important;}
    .rel-table td.vazio::before{content:"";}
    .rel-table tfoot tr{padding:12px 16px;background:var(--brand-soft);border-top:2px solid var(--brand);}
    .rel-table tfoot td{background:transparent !important;border:none !important;padding:4px 0 !important;font-size:13.5px;}
    .rel-table tfoot td.nome{font-size:14px;}
  }

  @media (max-width:640px){
    .logo{font-size:24px;}
    .tab{font-size:13px;margin-right:16px;}
    .stats{grid-template-columns:1fr;}
    .stat{border-bottom:1px solid var(--border);border-right:none;padding:16px 18px;}
    .stat:last-child{border-bottom:none;}
    .stat .value{font-size:23px;}
    .toolbar{gap:8px;}
    .month-nav{width:100%;justify-content:space-between;}
    .search-input{max-width:none;width:100%;order:3;}
    .select-input{flex:1;}
    .toolbar .btn{width:100%;order:4;}
    .toolbar .spacer{display:none;}
    .result-left .value{font-size:30px;}
    .entries-grid{grid-template-columns:1fr;}
    .modal{padding:22px 18px 20px;border-radius:14px;}
    .modal-title{font-size:19px;}
    .field-row{grid-template-columns:1fr;gap:14px;}
    .modal-overlay{padding:0;align-items:stretch;}
    .modal-overlay .modal{max-width:none;width:100%;min-height:100%;border-radius:0;}
    thead th{padding:11px 12px;font-size:10.5px;}
    tbody td{padding:12px 12px;font-size:13px;}
  }

  @media (max-width:400px){
    .cat-row{flex-direction:column;}
    .add-cat-btn{padding:9px 14px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, setDoc, onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyAxRnB9Ok7q8f38XlEOcSHR9XLGtWSKx_g",
    authDomain: "financeiro-bes-5d0b9.firebaseapp.com",
    projectId: "financeiro-bes-5d0b9",
    storageBucket: "financeiro-bes-5d0b9.firebasestorage.app",
    messagingSenderId: "393783547016",
    appId: "1:393783547016:web:de746eca5b0df6efc63b3d"
  };

  var fbApp = initializeApp(firebaseConfig);
  var db = getFirestore(fbApp);
  // Documento PRÓPRIO deste sistema: não lê nem altera os dados do arquivo de exemplo (financeiro/data)
  var dataDocRef = doc(db, "barros-sousa", "data");

(function(){
  "use strict";

  var MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  var ADVOGADAS = [
    {id:'flavia',   nome:'Dra. Flávia'},
    {id:'nathalia', nome:'Dra. Nathalia'},
    {id:'ambas',    nome:'Ambas'}
  ];
  function advNome(id){
    var a = ADVOGADAS.filter(function(x){return x.id===id;})[0];
    return a ? a.nome : '—';
  }

  var state = {
    tab: 'dashboard',
    month: { y: new Date().getFullYear(), m: new Date().getMonth() + 1 },
    recorrentes: [],
    pontuais: [],
    despesas: [],
    categorias: [],
    viewModeRec: 'grid',
    viewModePont: 'grid',
    viewModeDesp: 'table',
    sortRec: 'none',
    sortPont: 'none',
    sortDesp: 'none',
    searchRec: '',
    searchPont: '',
    searchDesp: '',
    searchRel: '',
    statusFilterDesp: 'todos',
    modal: null,
    loaded: false
  };

  // ---------- storage ----------
  var CACHE_KEY = 'barros-sousa-data-cache';
  var persistTimer = null;
  var applyingRemote = false;

  function saveCache(){
    try{
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        recorrentes: state.recorrentes,
        pontuais: state.pontuais,
        despesas: state.despesas,
        categorias: state.categorias
      }));
    }catch(e){}
  }

  function persist(){
    saveCache();
    if(applyingRemote) return;
    clearTimeout(persistTimer);
    persistTimer = setTimeout(function(){
      setDoc(dataDocRef, {
        recorrentes: state.recorrentes,
        pontuais: state.pontuais,
        despesas: state.despesas,
        categorias: state.categorias,
        updatedAt: serverTimestamp()
      }).catch(function(e){ console.error('Firestore save error', e); });
    }, 400);
  }

  async function load(){
    try{
      var raw = localStorage.getItem(CACHE_KEY);
      if(raw){
        var c = JSON.parse(raw);
        state.recorrentes = c.recorrentes || [];
        state.pontuais = c.pontuais || [];
        state.despesas = c.despesas || [];
        state.categorias = c.categorias || [];
      }
    }catch(e){}
    state.loaded = true;
    render();

    onSnapshot(dataDocRef, function(snap){
      if(!snap.exists()) return;
      var d = snap.data();
      applyingRemote = true;
      state.recorrentes = d.recorrentes || [];
      state.pontuais = d.pontuais || [];
      state.despesas = d.despesas || [];
      state.categorias = d.categorias || [];
      state.loaded = true;
      saveCache();
      if(!state.modal) render();
      applyingRemote = false;
    }, function(err){
      console.error('Firestore sync error', err);
    });
  }

  // ---------- helpers ----------
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function key(y,m){ return y + '-' + String(m).padStart(2,'0'); }
  function idx(y,m){ return y*12+m; }
  function addMonths(y,m,n){
    var t = idx(y,m) + n;
    var ny = Math.floor((t-1)/12);
    var nm = t - ny*12;
    return {y:ny, m:nm};
  }
  function fmtMonthYear(y,m){ return MONTHS[m-1] + ' ' + y; }
  function fmtCurrency(v){
    v = v || 0;
    return 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function round2(v){ return Math.round((v + Number.EPSILON) * 100) / 100; }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- recorrentes ----------
  function recActiveInMonth(e, y, m){
    var startIdx = idx(e.startY, e.startM);
    var endIdx = startIdx + (e.prazoMeses||1) - 1;
    var cur = idx(y,m);
    return cur >= startIdx && cur <= endIdx;
  }
  function recValueForMonth(e, y, m){
    if(e.valoresTipo === 'varia'){
      var v = e.valoresPorMes && e.valoresPorMes[key(y,m)];
      return (v !== undefined && v !== null && v !== '') ? parseFloat(v) : parseFloat(e.valorMensal||0);
    }
    return parseFloat(e.valorMensal||0);
  }
  function recRecebido(e, y, m){
    return !!(e.pagamentos && e.pagamentos[key(y,m)]);
  }

  // ---------- pontuais ----------
  function pontInMonth(e, y, m){ return e.refY === y && e.refM === m; }
  function pontRecebido(e){ return !!e.recebido; }

  // ---------- despesas ----------
  function despActiveInMonth(e, y, m){
    var base = idx(e.vencY, e.vencM);
    var cur = idx(y,m);
    if(e.tipo === 'pontual') return cur === base;
    if(cur < base) return false;
    if(e.recorrenciaTipo === 'determinado') return cur <= base + (e.recorrenciaMeses||1) - 1;
    return true;
  }
  function despStatusForMonth(e, y, m){
    if(e.tipo === 'recorrente'){
      var k = key(y,m);
      if(e.statusPorMes && e.statusPorMes[k]) return e.statusPorMes[k];
      return e.status;
    }
    return e.status;
  }
  function despSetStatusForMonth(e, y, m, val){
    if(e.tipo === 'recorrente'){
      e.statusPorMes = e.statusPorMes || {};
      e.statusPorMes[key(y,m)] = val;
    } else {
      e.status = val;
    }
  }

  // ---------- render root ----------
  function render(){
    var app = document.getElementById('app');
    if(!state.loaded){ app.innerHTML = ''; return; }
    var html = '';
    html += renderHeader();
    html += '<div class="tabs">';
    [['dashboard','Dashboard'],['recorrentes','Recorrentes'],['pontuais','Pontuais'],['despesas','Despesas'],['relatorios','Relatórios']].forEach(function(t){
      html += '<div class="tab '+(state.tab===t[0]?'active':'')+'" data-tab="'+t[0]+'">'+t[1]+'</div>';
    });
    html += '</div>';

    if(state.tab === 'dashboard') html += renderDashboard();
    else if(state.tab === 'recorrentes') html += renderRecorrentes();
    else if(state.tab === 'pontuais') html += renderPontuais();
    else if(state.tab === 'despesas') html += renderDespesas();
    else if(state.tab === 'relatorios') html += renderRelatorios();

    app.innerHTML = html;

    if(state.modal) renderModal();
    else { var ex = document.querySelector('.modal-overlay'); if(ex) ex.remove(); }

    bindEvents();
  }

  function renderHeader(){
    return '<div class="header">' +
      '<div class="eyebrow">SISTEMA DE GESTÃO</div>' +
      '<div class="logo">BARROS &amp; SOUSA</div>' +
    '</div>';
  }

  function viewToggle(name, current){
    var gridIcon = '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"></rect><rect x="9" y="1" width="6" height="6" rx="1"></rect><rect x="1" y="9" width="6" height="6" rx="1"></rect><rect x="9" y="9" width="6" height="6" rx="1"></rect></svg>';
    var listIcon = '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2.4" rx="1"></rect><rect x="1" y="6.8" width="14" height="2.4" rx="1"></rect><rect x="1" y="11.6" width="14" height="2.4" rx="1"></rect></svg>';
    return '<div class="view-toggle">' +
      '<button type="button" title="Cards" data-view-name="'+name+'" data-view-mode="grid" class="'+(current==='grid'?'active':'')+'">'+gridIcon+'</button>' +
      '<button type="button" title="Lista" data-view-name="'+name+'" data-view-mode="table" class="'+(current==='table'?'active':'')+'">'+listIcon+'</button>' +
    '</div>';
  }

  function sortSelect(name, current, label){
    return '<select class="select-input" data-sort-name="'+name+'">' +
      '<option value="none">'+label+': padrão</option>' +
      '<option value="asc" '+(current==='asc'?'selected':'')+'>'+label+': crescente</option>' +
      '<option value="desc" '+(current==='desc'?'selected':'')+'>'+label+': decrescente</option>' +
    '</select>';
  }

  function monthNav(){
    return '<div class="month-nav">' +
      '<button data-action="month-prev">&#8249;</button>' +
      '<div class="label">'+fmtMonthYear(state.month.y, state.month.m)+'</div>' +
      '<button data-action="month-next">&#8250;</button>' +
    '</div>';
  }

  // ---------- Dashboard ----------
  function renderDashboard(){
    var y = state.month.y, m = state.month.m;
    var previsto = 0, recebido = 0;
    var aReceber = [];

    state.recorrentes.forEach(function(e){
      if(recActiveInMonth(e,y,m)){
        var v = recValueForMonth(e,y,m);
        previsto += v;
        if(recRecebido(e,y,m)) recebido += v;
        else aReceber.push({cliente:e.cliente, valor:v, dia:e.diaPagamento, origem:'recorrente', id:e.id});
      }
    });
    state.pontuais.forEach(function(e){
      if(pontInMonth(e,y,m)){
        var v = parseFloat(e.valor||0);
        previsto += v;
        if(pontRecebido(e)) recebido += v;
        else aReceber.push({cliente:e.cliente, valor:v, dia:e.diaPagamento, origem:'pontual', id:e.id});
      }
    });

    var gasto = 0, gastoPago = 0, gastoAberto = 0;
    state.despesas.forEach(function(e){
      if(despActiveInMonth(e,y,m)){
        var v = parseFloat(e.valor||0);
        gasto += v;
        var st = despStatusForMonth(e,y,m);
        if(st === 'pago') gastoPago += v; else gastoAberto += v;
      }
    });

    var emAberto = previsto - recebido;
    var resultado = recebido - gastoPago;
    var pct = previsto > 0 ? Math.min(100, Math.round((recebido/previsto)*100)) : 0;

    var html = '<div class="toolbar">' + monthNav() + '</div>';

    html += '<div class="stats">' +
      stat('PREVISTO', fmtCurrency(previsto), fmtMonthYear(y,m)) +
      stat('RECEBIDO', fmtCurrency(recebido), '—', 'green') +
      stat('EM ABERTO', fmtCurrency(emAberto), emAberto>0?'a receber':'nada em aberto', 'amber') +
      stat('GASTO', fmtCurrency(gasto), gastoAberto>0?fmtCurrency(gastoAberto)+' a pagar':'tudo pago', 'red') +
    '</div>';

    html += '<div class="result-panel">' +
      '<div class="result-left">' +
        '<div class="label">RESULTADO DO MÊS</div>' +
        '<div class="value">'+fmtCurrency(resultado)+'</div>' +
        '<div class="sub">'+(previsto===0?'sem receita no mês':'recebido menos o que saiu')+'</div>' +
      '</div>' +
      '<div class="result-right">' +
        '<div class="tag">recebido menos o que saiu</div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>' +
        '<div class="progress-caption">recebido '+pct+'% do previsto · recorrente '+fmtCurrency(sumRecPrevisto(y,m))+' · pontual '+fmtCurrency(sumPontPrevisto(y,m))+'</div>' +
      '</div>' +
    '</div>';

    html += '<div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">A RECEBER <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint);font-weight:500;">'+(aReceber.length===0?'nada em aberto':aReceber.length+' em aberto')+'</span></div>';

    if(aReceber.length === 0){
      html += emptyState('&#10003;', 'Nada em aberto neste mês', 'Tudo o que era pra entrar, entrou.');
    } else {
      html += '<div class="entries-grid">';
      aReceber.forEach(function(item){
        html += '<div class="entry-card">' +
          '<div class="row1"><div class="client">'+escapeHtml(item.cliente||'Sem nome')+'</div>' +
          '<span class="pill amber">Em aberto</span></div>' +
          '<div class="value">'+fmtCurrency(item.valor)+'</div>' +
          '<div class="meta">Vence dia '+(item.dia||'-')+' · '+(item.origem==='recorrente'?'Recorrente':'Pontual')+'</div>' +
        '</div>';
      });
      html += '</div>';
    }
    return html;
  }

  function sumRecPrevisto(y,m){
    var t=0;
    state.recorrentes.forEach(function(e){ if(recActiveInMonth(e,y,m)) t+=recValueForMonth(e,y,m); });
    return t;
  }
  function sumPontPrevisto(y,m){
    var t=0;
    state.pontuais.forEach(function(e){ if(pontInMonth(e,y,m)) t+=parseFloat(e.valor||0); });
    return t;
  }

  function stat(label, value, sub, cls){
    return '<div class="stat"><div class="label">'+label+'</div><div class="value '+(cls||'')+'">'+value+'</div><div class="sub">'+sub+'</div></div>';
  }

  function emptyState(icon, title, desc){
    return '<div class="empty">' +
      '<div style="font-size:30px;opacity:.3;margin-bottom:14px;">'+icon+'</div>' +
      '<div class="title">'+title+'</div>' +
      '<div class="desc">'+desc+'</div>' +
    '</div>';
  }

  // ---------- Recorrentes ----------
  function renderRecorrentes(){
    var y = state.month.y, m = state.month.m;
    var active = state.recorrentes.filter(function(e){ return recActiveInMonth(e,y,m); });
    var faturamentoTotal = 0, recebido = 0;
    active.forEach(function(e){
      var v = recValueForMonth(e,y,m);
      faturamentoTotal += v;
      if(recRecebido(e,y,m)) recebido += v;
    });
    var emAberto = faturamentoTotal - recebido;

    var proj = 0;
    for(var i=0;i<12;i++){
      var mm = addMonths(y,m,i);
      state.recorrentes.forEach(function(e){
        if(recActiveInMonth(e, mm.y, mm.m)) proj += recValueForMonth(e, mm.y, mm.m);
      });
    }

    var html = '<div class="stats">' +
      stat('FATURAMENTO TOTAL', fmtCurrency(faturamentoTotal), fmtMonthYear(y,m)+' · '+active.length+' contrato(s)') +
      stat('RECEBIDO', fmtCurrency(recebido), '—', 'green') +
      stat('EM ABERTO', fmtCurrency(emAberto), emAberto>0?'em aberto':'nenhum atrasado', 'amber') +
      stat('PROJEÇÃO 12 MESES', fmtCurrency(proj), 'a partir de '+fmtMonthYear(y,m), 'blue') +
    '</div>';

    html += '<div class="toolbar">' + monthNav() +
      '<input class="search-input" id="search-rec" placeholder="Buscar cliente..." value="'+escapeHtml(state.searchRec)+'">' +
      sortSelect('rec', state.sortRec, 'Dia de pagamento') +
      viewToggle('rec', state.viewModeRec) +
      '<div class="spacer"></div>' +
      '<button class="btn btn-primary" data-action="open-recorrente">+ Nova entrada</button>' +
    '</div>';

    var filtered = active.filter(function(e){
      return !state.searchRec || (e.cliente||'').toLowerCase().indexOf(state.searchRec.toLowerCase()) > -1;
    });

    if(state.sortRec === 'asc') filtered.sort(function(a,b){ return (a.diaPagamento||0) - (b.diaPagamento||0); });
    else if(state.sortRec === 'desc') filtered.sort(function(a,b){ return (b.diaPagamento||0) - (a.diaPagamento||0); });

    if(state.recorrentes.length === 0){
      html += emptyState('&#8635;', 'Você ainda não tem entradas recorrentes', 'Adicione a primeira e acompanhe seu faturamento crescer.');
    } else if(filtered.length === 0){
      html += emptyState('&#8635;', 'Nenhuma entrada neste mês', 'Ajuste o mês ou a busca para ver outras entradas.');
    } else if(state.viewModeRec === 'table'){
      html += '<div class="table-wrap"><table><thead><tr>' +
        '<th>CLIENTE</th><th>ADVOGADA</th><th>VALOR</th><th>DIA</th><th>PERÍODO</th><th>STATUS</th><th style="text-align:right;">AÇÕES</th>' +
      '</tr></thead><tbody>';
      filtered.forEach(function(e){
        var v = recValueForMonth(e,y,m);
        var rec = recRecebido(e,y,m);
        var endInfo = addMonths(e.startY, e.startM, (e.prazoMeses||1)-1);
        html += '<tr>' +
          '<td>'+escapeHtml(e.cliente||'Sem nome')+'</td>' +
          '<td>'+(e.advogada?'<span class="adv-pill">'+advNome(e.advogada)+'</span>':'<span style="color:var(--ink-faint);">—</span>')+'</td>' +
          '<td class="valor-cell">'+fmtCurrency(v)+'</td>' +
          '<td>'+e.diaPagamento+'</td>' +
          '<td>'+fmtMonthYear(e.startY,e.startM)+' a '+fmtMonthYear(endInfo.y,endInfo.m)+'</td>' +
          '<td><span class="pill '+(rec?'green':'amber')+'">'+(rec?'Recebido':'Em aberto')+'</span></td>' +
          '<td><div class="row-actions" style="justify-content:flex-end;">' +
            '<button class="icon-btn" data-action="toggle-rec-recebido" data-id="'+e.id+'" title="Marcar como recebido/em aberto">&#10003;</button>' +
            '<button class="icon-btn" data-action="edit-recorrente" data-id="'+e.id+'">&#9998;</button>' +
            '<button class="icon-btn" data-action="delete-recorrente" data-id="'+e.id+'">&#128465;</button>' +
          '</div></td>' +
        '</tr>';
      });
      html += '</tbody></table></div>';
    } else {
      html += '<div class="entries-grid">';
      filtered.forEach(function(e){
        var v = recValueForMonth(e,y,m);
        var rec = recRecebido(e,y,m);
        var endInfo = addMonths(e.startY, e.startM, (e.prazoMeses||1)-1);
        html += '<div class="entry-card">' +
          '<div class="row1"><div class="client">'+escapeHtml(e.cliente||'Sem nome')+'</div>' +
          '<span class="pill '+(rec?'green':'amber')+'">'+(rec?'Recebido':'Em aberto')+'</span></div>' +
          '<div class="value">'+fmtCurrency(v)+'<span style="font-size:12px;color:var(--ink-faint);font-weight:600;">/mês</span></div>' +
          '<div class="meta">Dia '+e.diaPagamento+' · '+fmtMonthYear(e.startY,e.startM)+' a '+fmtMonthYear(endInfo.y,endInfo.m)+'</div>' +
          (e.advogada ? '<div class="desc"><span class="adv-pill">'+advNome(e.advogada)+'</span></div>' : '') +
          (e.descricao ? '<div class="desc">'+escapeHtml(e.descricao)+'</div>' : '') +
          '<div class="actions">' +
            '<button class="mark-btn '+(rec?'done':'')+'" data-action="toggle-rec-recebido" data-id="'+e.id+'">'+(rec?'Recebido':'Marcar recebido')+'</button>' +
            '<div class="spacer"></div>' +
            '<button class="icon-btn" data-action="edit-recorrente" data-id="'+e.id+'">&#9998;</button>' +
            '<button class="icon-btn" data-action="delete-recorrente" data-id="'+e.id+'">&#128465;</button>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
    }
    return html;
  }

  // ---------- Pontuais ----------
  function renderPontuais(){
    var y = state.month.y, m = state.month.m;
    var inMonth = state.pontuais.filter(function(e){ return pontInMonth(e,y,m); });
    var recebido = 0, previsto = 0;
    inMonth.forEach(function(e){
      var v = parseFloat(e.valor||0);
      previsto += v;
      if(pontRecebido(e)) recebido += v;
    });
    var emAberto = previsto - recebido;

    var html = '<div class="stats">' +
      stat('QUANTIDADE DE ENTRADAS', String(inMonth.length), inMonth.length+' entrada(s) no mês') +
      stat('RECEBIDO', fmtCurrency(recebido), '—', 'green') +
      stat('EM ABERTO', fmtCurrency(emAberto), emAberto>0?'em aberto':'nenhum atrasado', 'amber') +
      stat('TOTAL PREVISTO', fmtCurrency(previsto), fmtMonthYear(y,m), 'blue') +
    '</div>';

    html += '<div class="toolbar">' + monthNav() +
      '<input class="search-input" id="search-pont" placeholder="Buscar entrada..." value="'+escapeHtml(state.searchPont)+'">' +
      sortSelect('pont', state.sortPont, 'Dia de pagamento') +
      viewToggle('pont', state.viewModePont) +
      '<div class="spacer"></div>' +
      '<button class="btn btn-primary" data-action="open-pontual">+ Nova entrada</button>' +
    '</div>';

    var filtered = inMonth.filter(function(e){
      return !state.searchPont || (e.cliente||'').toLowerCase().indexOf(state.searchPont.toLowerCase()) > -1;
    });

    if(state.sortPont === 'asc') filtered.sort(function(a,b){ return (a.diaPagamento||0) - (b.diaPagamento||0); });
    else if(state.sortPont === 'desc') filtered.sort(function(a,b){ return (b.diaPagamento||0) - (a.diaPagamento||0); });

    if(state.pontuais.length === 0){
      html += emptyState('&#9889;', 'Você ainda não tem entradas pontuais', 'Cadastre trabalhos avulsos e acompanhe os recebimentos.');
    } else if(filtered.length === 0){
      html += emptyState('&#9889;', 'Nenhuma entrada neste mês', 'Ajuste o mês ou a busca para ver outras entradas.');
    } else if(state.viewModePont === 'table'){
      html += '<div class="table-wrap"><table><thead><tr>' +
        '<th>CLIENTE</th><th>ADVOGADA</th><th>VALOR</th><th>PAGAMENTO</th><th>DIA</th><th>STATUS</th><th style="text-align:right;">AÇÕES</th>' +
      '</tr></thead><tbody>';
      filtered.forEach(function(e){
        var rec = pontRecebido(e);
        html += '<tr>' +
          '<td>'+escapeHtml(e.cliente||'Sem nome')+'</td>' +
          '<td>'+(e.advogada?'<span class="adv-pill">'+advNome(e.advogada)+'</span>':'<span style="color:var(--ink-faint);">—</span>')+'</td>' +
          '<td class="valor-cell">'+fmtCurrency(e.valor)+'</td>' +
          '<td>'+(e.pagamentoTipo==='parcelado'?'Parcelado em '+(e.parcelas||1)+'x':'À vista')+'</td>' +
          '<td>'+e.diaPagamento+'</td>' +
          '<td><span class="pill '+(rec?'green':'amber')+'">'+(rec?'Recebido':'Em aberto')+'</span></td>' +
          '<td><div class="row-actions" style="justify-content:flex-end;">' +
            '<button class="icon-btn" data-action="toggle-pont-recebido" data-id="'+e.id+'" title="Marcar como recebido/em aberto">&#10003;</button>' +
            '<button class="icon-btn" data-action="edit-pontual" data-id="'+e.id+'">&#9998;</button>' +
            '<button class="icon-btn" data-action="delete-pontual" data-id="'+e.id+'">&#128465;</button>' +
          '</div></td>' +
        '</tr>';
      });
      html += '</tbody></table></div>';
    } else {
      html += '<div class="entries-grid">';
      filtered.forEach(function(e){
        var rec = pontRecebido(e);
        html += '<div class="entry-card">' +
          '<div class="row1"><div class="client">'+escapeHtml(e.cliente||'Sem nome')+'</div>' +
          '<span class="pill '+(rec?'green':'amber')+'">'+(rec?'Recebido':'Em aberto')+'</span></div>' +
          '<div class="value">'+fmtCurrency(e.valor)+'</div>' +
          '<div class="meta">'+(e.pagamentoTipo==='parcelado'?'Parcelado em '+(e.parcelas||1)+'x':'À vista')+' · Dia '+e.diaPagamento+'</div>' +
          (e.advogada ? '<div class="desc"><span class="adv-pill">'+advNome(e.advogada)+'</span></div>' : '') +
          (e.descricao ? '<div class="desc">'+escapeHtml(e.descricao)+'</div>' : '') +
          '<div class="actions">' +
            '<button class="mark-btn '+(rec?'done':'')+'" data-action="toggle-pont-recebido" data-id="'+e.id+'">'+(rec?'Recebido':'Marcar recebido')+'</button>' +
            '<div class="spacer"></div>' +
            '<button class="icon-btn" data-action="edit-pontual" data-id="'+e.id+'">&#9998;</button>' +
            '<button class="icon-btn" data-action="delete-pontual" data-id="'+e.id+'">&#128465;</button>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
    }
    return html;
  }

  // ---------- Despesas ----------
  function renderDespesas(){
    var y = state.month.y, m = state.month.m;
    var inMonth = state.despesas.filter(function(e){ return despActiveInMonth(e,y,m); });

    var total = 0, pago = 0, aPagar = 0, recorrentesTotal = 0;
    inMonth.forEach(function(e){
      var v = parseFloat(e.valor||0);
      total += v;
      var st = despStatusForMonth(e,y,m);
      if(st === 'pago') pago += v; else aPagar += v;
      if(e.tipo === 'recorrente') recorrentesTotal += v;
    });

    var html = '<div class="stats">' +
      stat('TOTAL DO MÊS', fmtCurrency(total), inMonth.length+' lançamento(s)') +
      stat('PAGO', fmtCurrency(pago), '—', 'green') +
      stat('A PAGAR', fmtCurrency(aPagar), aPagar>0?inMonth.filter(function(e){return despStatusForMonth(e,y,m)!=='pago';}).length+' em aberto':'0 em aberto', 'amber') +
      stat('RECORRENTES', fmtCurrency(recorrentesTotal), 'custos fixos do mês', 'blue') +
    '</div>';

    html += '<div class="toolbar">' + monthNav() +
      '<input class="search-input" id="search-desp" placeholder="Buscar despesa..." value="'+escapeHtml(state.searchDesp)+'">' +
      '<select class="select-input" id="status-filter-desp">' +
        '<option value="todos"'+(state.statusFilterDesp==='todos'?' selected':'')+'>Todos os status</option>' +
        '<option value="a_pagar"'+(state.statusFilterDesp==='a_pagar'?' selected':'')+'>A pagar</option>' +
        '<option value="pago"'+(state.statusFilterDesp==='pago'?' selected':'')+'>Pago</option>' +
      '</select>' +
      sortSelect('desp', state.sortDesp, 'Vencimento') +
      viewToggle('desp', state.viewModeDesp) +
      '<div class="spacer"></div>' +
      '<button class="btn btn-primary" data-action="open-despesa">+ Nova despesa</button>' +
    '</div>';

    var filtered = inMonth.filter(function(e){
      var matchSearch = !state.searchDesp || (e.descricao||'').toLowerCase().indexOf(state.searchDesp.toLowerCase()) > -1;
      var st = despStatusForMonth(e,y,m);
      var matchStatus = state.statusFilterDesp === 'todos' || state.statusFilterDesp === st;
      return matchSearch && matchStatus;
    });

    if(state.sortDesp === 'asc') filtered.sort(function(a,b){ return (a.vencDia||0) - (b.vencDia||0); });
    else if(state.sortDesp === 'desc') filtered.sort(function(a,b){ return (b.vencDia||0) - (a.vencDia||0); });

    if(state.despesas.length === 0){
      html += emptyState('&#128179;', 'Nenhuma despesa neste mês', 'Lance seus custos fixos e variáveis para enxergar o resultado real.');
    } else if(filtered.length === 0){
      html += emptyState('&#128179;', 'Nenhuma despesa encontrada', 'Ajuste os filtros para ver outras despesas.');
    } else if(state.viewModeDesp === 'grid'){
      html += '<div class="entries-grid">';
      filtered.forEach(function(e){
        var st = despStatusForMonth(e,y,m);

  // ---------- Relatórios ----------
  var ISS_RATE = 0.045, CX_RATE = 0.10, P60 = 0.60, P40 = 0.40;

  function calcRelatorio(valor){
    var v = round2(valor);
    var iss = round2(v * ISS_RATE);
    var vIss = round2(v - iss);
    var cx = round2(vIss * CX_RATE);
    var saldo = round2(vIss - cx);
    var p60 = round2(saldo * P60);
    var p40 = round2(saldo * P40);
    return {valor:v, iss:iss, vIss:vIss, cx:cx, saldo:saldo, p60:p60, p40:p40};
  }

  // Linhas do mês para uma advogada, ordenadas pelo dia de vencimento (a data em si não é exibida).
  // Em caso de mesmo dia, mantém a ordem de cadastro (novas entradas entram na sequência).
  function relRowsFor(adv, y, m){
    var rows = [];
    var q = (state.searchRel || '').toLowerCase();
    state.recorrentes.forEach(function(e, i){
      if(e.advogada === adv && recActiveInMonth(e,y,m)){
        rows.push({cliente:e.cliente||'Sem nome', valor:recValueForMonth(e,y,m), dia:parseInt(e.diaPagamento)||0, ord:i});
      }
    });
    state.pontuais.forEach(function(e, i){
      if(e.advogada === adv && pontInMonth(e,y,m)){
        rows.push({cliente:e.cliente||'Sem nome', valor:parseFloat(e.valor||0), dia:parseInt(e.diaPagamento)||0, ord:100000+i});
      }
    });
    rows = rows.filter(function(r){ return !q || r.cliente.toLowerCase().indexOf(q) > -1; });
    rows.sort(function(a,b){ return (a.dia - b.dia) || (a.ord - b.ord); });
    return rows;
  }

  function relTable(adv){
    var y = state.month.y, m = state.month.m;
    var rows = relRowsFor(adv.id, y, m);
    var tot = {valor:0, iss:0, vIss:0, cx:0, saldo:0, p60:0, p40:0};

    var html = '<div class="rel-block">' +
      '<div class="rel-head"><div class="rel-title"><span class="dot"></span>'+escapeHtml(adv.nome)+'</div>' +
      '<div class="rel-count">'+rows.length+' entrada(s) · '+fmtMonthYear(y,m)+'</div></div>' +
      '<div class="table-wrap"><table class="rel-table"><thead><tr>' +
        '<th>CLIENTE</th><th class="num">VALOR</th><th class="num">ISS BRUTO</th><th class="num">V - ISS</th>' +
        '<th class="num">CX LIQ.</th><th class="num">SALDO LIQ.</th><th class="num">60%</th><th class="num">40%</th>' +
      '</tr></thead><tbody>';

    if(rows.length === 0){
      html += '<tr><td class="vazio" colspan="8">Nenhuma entrada para este mês.</td></tr>';
    }
    rows.forEach(function(r){
      var c = calcRelatorio(r.valor);
      Object.keys(tot).forEach(function(k){ tot[k] = round2(tot[k] + c[k]); });
      html += '<tr>' +
        '<td class="nome" data-label="Cliente">'+escapeHtml(r.cliente)+'</td>' +
        '<td class="num" data-label="Valor">'+fmtCurrency(c.valor)+'</td>' +
        '<td class="num" data-label="ISS Bruto">'+fmtCurrency(c.iss)+'</td>' +
        '<td class="num" data-label="V - ISS">'+fmtCurrency(c.vIss)+'</td>' +
        '<td class="num" data-label="Cx Liq.">'+fmtCurrency(c.cx)+'</td>' +
        '<td class="num" data-label="Saldo Liq.">'+fmtCurrency(c.saldo)+'</td>' +
        '<td class="num" data-label="60%">'+fmtCurrency(c.p60)+'</td>' +
        '<td class="num" data-label="40%">'+fmtCurrency(c.p40)+'</td>' +
      '</tr>';
    });

    html += '</tbody><tfoot><tr>' +
      '<td class="nome" data-label="">TOTAL</td>' +
      '<td class="num" data-label="Valor">'+fmtCurrency(tot.valor)+'</td>' +
      '<td class="num" data-label="ISS Bruto">'+fmtCurrency(tot.iss)+'</td>' +
      '<td class="num" data-label="V - ISS">'+fmtCurrency(tot.vIss)+'</td>' +
      '<td class="num" data-label="Cx Liq.">'+fmtCurrency(tot.cx)+'</td>' +
      '<td class="num" data-label="Saldo Liq.">'+fmtCurrency(tot.saldo)+'</td>' +
      '<td class="num" data-label="60%">'+fmtCurrency(tot.p60)+'</td>' +
      '<td class="num" data-label="40%">'+fmtCurrency(tot.p40)+'</td>' +
    '</tr></tfoot></table></div></div>';
    return html;
  }

  // ---------- Modals ----------
  function openModal(type, editId){
    var draft = {};
    if(type === 'recorrente'){
      if(editId){
        var e = state.recorrentes.find(function(x){return x.id===editId;});
        draft = Object.assign({}, e);
      } else {
        draft = { cliente:'', advogada:'flavia', valorMensal:'', diaPagamento:5, prazoMeses:6, startY:state.month.y, startM:state.month.m, valoresTipo:'mesmo', valoresPorMes:{}, descricao:'' };
      }
    } else if(type === 'pontual'){
      if(editId){
        var e2 = state.pontuais.find(function(x){return x.id===editId;});
        draft = Object.assign({}, e2);
      } else {
        draft = { cliente:'', advogada:'flavia', pagamentoTipo:'vista', valor:'', parcelas:2, diaPagamento:5, refY:state.month.y, refM:state.month.m, descricao:'' };
      }
    } else if(type === 'despesa'){
      if(editId){
        var e3 = state.despesas.find(function(x){return x.id===editId;});
        draft = Object.assign({}, e3);
      } else {
        draft = { descricao:'', categoria:'', tipo:'pontual', vencY:state.month.y, vencM:state.month.m, vencDia:5, valor:'', status:'a_pagar', observacoes:'', recorrenciaTipo:'continua', recorrenciaMeses:6 };
      }
    }
    state.modal = { type: type, editId: editId || null, draft: draft };
    render();
  }
  function closeModal(){ state.modal = null; render(); }

  function renderModal(){
    var overlay = document.querySelector('.modal-overlay');
    if(!overlay){
      overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      document.body.appendChild(overlay);
    }
    var m = state.modal;
    var content = '';
    if(m.type === 'recorrente') content = modalRecorrente(m);
    else if(m.type === 'pontual') content = modalPontual(m);
    else if(m.type === 'despesa') content = modalDespesa(m);
    overlay.innerHTML = '<div class="modal">'+content+'</div>';

    overlay.onclick = function(ev){ if(ev.target === overlay) closeModal(); };
    bindModalEvents();
  }

  // ---------- Event binding ----------
  function bindEvents(){
    document.querySelectorAll('[data-tab]').forEach(function(el){
      el.onclick = function(){ state.tab = el.getAttribute('data-tab'); render(); };
    });
    document.querySelectorAll('[data-action="month-prev"]').forEach(function(el){
      el.onclick = function(){ var r = addMonths(state.month.y, state.month.m, -1); state.month = r; render(); };
    });
    document.querySelectorAll('[data-action="month-next"]').forEach(function(el){
      el.onclick = function(){ var r = addMonths(state.month.y, state.month.m, 1); state.month = r; render(); };
    });

    bind('open-recorrente', function(){ openModal('recorrente'); });
    bind('open-pontual', function(){ openModal('pontual'); });
    bind('open-despesa', function(){ openModal('despesa'); });
    bindEach('edit-recorrente', function(id){ openModal('recorrente', id); });
    bindEach('edit-pontual', function(id){ openModal('pontual', id); });
    bindEach('edit-despesa', function(id){ openModal('despesa', id); });
    bindEach('delete-recorrente', function(id){
      if(confirm('Excluir esta entrada recorrente?')){
        state.recorrentes = state.recorrentes.filter(function(e){return e.id!==id;});
        persist(); render();
      }
    });
    bindEach('delete-pontual', function(id){
      if(confirm('Excluir esta entrada pontual?')){
        state.pontuais = state.pontuais.filter(function(e){return e.id!==id;});
        persist(); render();
      }
    });
    bindEach('delete-despesa', function(id){
      if(confirm('Excluir esta despesa?')){
        state.despesas = state.despesas.filter(function(e){return e.id!==id;});
        persist(); render();
      }
    });
    bindEach('toggle-rec-recebido', function(id){
      var e = state.recorrentes.find(function(x){return x.id===id;});
      if(e){
        e.pagamentos = e.pagamentos || {};
        var k = key(state.month.y, state.month.m);
        e.pagamentos[k] = !e.pagamentos[k];
        persist(); render();
      }
    });
    bindEach('toggle-pont-recebido', function(id){
      var e = state.pontuais.find(function(x){return x.id===id;});
      if(e){ e.recebido = !e.recebido; persist(); render(); }
    });
    bindEach('toggle-desp-status', function(id){
      var e = state.despesas.find(function(x){return x.id===id;});
      if(e){
        var cur = despStatusForMonth(e, state.month.y, state.month.m);
        despSetStatusForMonth(e, state.month.y, state.month.m, cur==='pago'?'a_pagar':'pago');
        persist(); render();
      }
    });

    var sRec = document.getElementById('search-rec');
    if(sRec){ sRec.oninput = function(){ state.searchRec = sRec.value; renderKeepFocus('search-rec'); }; }
    var sPont = document.getElementById('search-pont');
    if(sPont){ sPont.oninput = function(){ state.searchPont = sPont.value; renderKeepFocus('search-pont'); }; }
    var sDesp = document.getElementById('search-desp');
    if(sDesp){ sDesp.oninput = function(){ state.searchDesp = sDesp.value; renderKeepFocus('search-desp'); }; }
    var sRel = document.getElementById('search-rel');
    if(sRel){ sRel.oninput = function(){ state.searchRel = sRel.value; renderKeepFocus('search-rel'); }; }
    var stDesp = document.getElementById('status-filter-desp');
    if(stDesp){ stDesp.onchange = function(){ state.statusFilterDesp = stDesp.value; render(); }; }

    document.querySelectorAll('[data-view-name]').forEach(function(el){
      el.onclick = function(){
        var name = el.getAttribute('data-view-name');
        var mode = el.getAttribute('data-view-mode');
        if(name==='rec') state.viewModeRec = mode;
        else if(name==='pont') state.viewModePont = mode;
        else if(name==='desp') state.viewModeDesp = mode;
        render();
      };
    });
    document.querySelectorAll('[data-sort-name]').forEach(function(el){
      el.onchange = function(){
        var name = el.getAttribute('data-sort-name');
        if(name==='rec') state.sortRec = el.value;
        else if(name==='pont') state.sortPont = el.value;
        else if(name==='desp') state.sortDesp = el.value;
        render();
      };
    });
  }

  function renderKeepFocus(id){
    var el = document.getElementById(id);
    var pos = el ? el.selectionStart : null;
    render();
    var el2 = document.getElementById(id);
    if(el2){ el2.focus(); if(pos!==null) el2.setSelectionRange(pos,pos); }
  }

  function bind(action, fn){
    document.querySelectorAll('[data-action="'+action+'"]').forEach(function(el){ el.onclick = fn; });
  }
  function bindEach(action, fn){
    document.querySelectorAll('[data-action="'+action+'"]').forEach(function(el){
      el.onclick = function(){ fn(el.getAttribute('data-id')); };
    });
  }

  function bindModalEvents(){
    bind('close-modal', closeModal);
    bind('save-recorrente', saveRecorrente);
    bind('save-pontual', savePontual);
    bind('save-despesa', saveDespesa);

    var elPrazo = document.getElementById('f-prazoMeses');
    if(elPrazo){
      elPrazo.oninput = function(){
        state.modal.draft.prazoMeses = elPrazo.value;
        var d = state.modal.draft;
        var end = addMonths(d.startY, d.startM, (parseInt(elPrazo.value)||1)-1);
        var helper = document.getElementById('prazo-helper');
        if(helper) helper.textContent = 'De '+fmtMonthYear(d.startY,d.startM)+' a '+fmtMonthYear(end.y,end.m);
      };
    }
    document.querySelectorAll('input[name="valoresTipo"]').forEach(function(el){
      el.onchange = function(){ state.modal.draft.valoresTipo = el.value; };
    });

    document.querySelectorAll('input[name="pagamentoTipo"]').forEach(function(el){
      el.onchange = function(){
        state.modal.draft.pagamentoTipo = el.value;
        var pf = document.getElementById('parcelas-field');
        if(pf) pf.style.display = (el.value==='parcelado') ? '' : 'none';
      };
    });
    bind('modal-month-prev', function(){
      var d = state.modal.draft;
      var r = addMonths(d.refY, d.refM, -1);
      d.refY = r.y; d.refM = r.m;
      document.getElementById('modal-month-label').textContent = fmtMonthYear(d.refY, d.refM);
    });
    bind('modal-month-next', function(){
      var d = state.modal.draft;
      var r = addMonths(d.refY, d.refM, 1);
      d.refY = r.y; d.refM = r.m;
      document.getElementById('modal-month-label').textContent = fmtMonthYear(d.refY, d.refM);
    });

    var tipoSel = document.getElementById('f-tipo');
    if(tipoSel){
      tipoSel.onchange = function(){
        state.modal.draft.tipo = tipoSel.value;
        render();
      };
    }
    document.querySelectorAll('input[name="recorrenciaTipo"]').forEach(function(el){
      el.onchange = function(){
        state.modal.draft.recorrenciaTipo = el.value;
        var mf = document.getElementById('recorrencia-meses-field');
        var help = document.getElementById('recorrencia-helper');
        if(mf) mf.style.display = (el.value==='determinado') ? '' : 'none';
        if(help) help.textContent = (el.value==='determinado') ? '' : 'Contínua: o sistema lança os próximos meses automaticamente.';
      };
    });
    bind('add-categoria', function(){
      var name = prompt('Nome da nova categoria:');
      if(name && name.trim()){
        name = name.trim();
        if(state.categorias.indexOf(name) === -1){
          state.categorias.push(name);
        }
        state.modal.draft.categoria = name;
        persist();
        render();
      }
    });
  }

  function saveRecorrente(){
    var d = state.modal.draft;
    var cliente = document.getElementById('f-cliente').value.trim();
    var advogada = document.getElementById('f-advogada').value;
    var valorMensal = parseFloat(document.getElementById('f-valorMensal').value);
    if(!cliente){ alert('Informe o cliente.'); return; }
    if(!advogada){ alert('Selecione a advogada responsável.'); return; }
    if(isNaN(valorMensal) || valorMensal <= 0){ alert('Informe um valor mensal válido.'); return; }

    var entry = {
      id: state.modal.editId || uid(),
      cliente: cliente,
      advogada: advogada,
      valorMensal: valorMensal,
      diaPagamento: parseInt(document.getElementById('f-diaPagamento').value) || 5,
      prazoMeses: parseInt(document.getElementById('f-prazoMeses').value) || 1,
      startY: d.startY, startM: d.startM,
      valoresTipo: (document.querySelector('input[name="valoresTipo"]:checked')||{}).value || 'mesmo',
      valoresPorMes: d.valoresPorMes || {},
      descricao: document.getElementById('f-descricao').value.trim(),
      pagamentos: d.pagamentos || {}
    };
    if(state.modal.editId){
      var i = state.recorrentes.findIndex(function(x){return x.id===state.modal.editId;});
      state.recorrentes[i] = entry;
    } else {
      state.recorrentes.push(entry);
    }
    persist();
    closeModal();
  }

  function savePontual(){
    var d = state.modal.draft;
    var cliente = document.getElementById('f-cliente').value.trim();
    var advogada = document.getElementById('f-advogada').value;
    var valor = parseFloat(document.getElementById('f-valor').value);
    if(!cliente){ alert('Informe o cliente.'); return; }
    if(!advogada){ alert('Selecione a advogada responsável.'); return; }
    if(isNaN(valor) || valor <= 0){ alert('Informe um valor válido.'); return; }

    var entry = {
      id: state.modal.editId || uid(),
      cliente: cliente,
      advogada: advogada,
      pagamentoTipo: (document.querySelector('input[name="pagamentoTipo"]:checked')||{}).value || 'vista',
      valor: valor,
      parcelas: parseInt((document.getElementById('f-parcelas')||{}).value) || 2,
      diaPagamento: parseInt(document.getElementById('f-diaPagamento').value) || 5,
      refY: d.refY, refM: d.refM,
      descricao: document.getElementById('f-descricao').value.trim(),
      recebido: d.recebido || false
    };
    if(state.modal.editId){
      var i = state.pontuais.findIndex(function(x){return x.id===state.modal.editId;});
      state.pontuais[i] = entry;
    } else {
      state.pontuais.push(entry);
    }
    persist();
    closeModal();
  }

  function saveDespesa(){
    var d = state.modal.draft;
    var descricao = document.getElementById('f-descricao').value.trim();
    var valor = parseFloat(document.getElementById('f-valor').value);
    var vencStr = document.getElementById('f-vencimento').value;
    if(!descricao){ alert('Informe a descrição.'); return; }
    if(isNaN(valor) || valor <= 0){ alert('Informe um valor válido.'); return; }
    if(!vencStr){ alert('Informe o vencimento.'); return; }
    var parts = vencStr.split('-');
    var vy = parseInt(parts[0]), vm = parseInt(parts[1]), vdia = parseInt(parts[2]);

    var tipo = document.getElementById('f-tipo').value;
    var entry = {
      id: state.modal.editId || uid(),
      descricao: descricao,
      categoria: document.getElementById('f-categoria').value,
      tipo: tipo,
      vencY: vy, vencM: vm, vencDia: vdia,
      valor: valor,
      status: document.getElementById('f-status').value,
      observacoes: document.getElementById('f-observacoes').value.trim(),
      recorrenciaTipo: tipo==='recorrente' ? ((document.querySelector('input[name="recorrenciaTipo"]:checked')||{}).value || 'continua') : null,
      recorrenciaMeses: tipo==='recorrente' ? (parseInt((document.getElementById('f-recorrenciaMeses')||{}).value) || 6) : null,
      statusPorMes: d.statusPorMes || {}
    };
    if(state.modal.editId){
      var i = state.despesas.findIndex(function(x){return x.id===state.modal.editId;});
      state.despesas[i] = entry;
    } else {
      state.despesas.push(entry);
    }
    persist();
    closeModal();
  }

  load();
})();
</script>
</body>
</html>
